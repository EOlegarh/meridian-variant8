{% extends 'base.html' %}{% block content %}<section class="catalog-top"><p class="kicker">Ближе к месту</p><h1>{{ title }}</h1><p>Города, горы и большие дороги. Начните с места, в котором давно хотели побывать.</p></section><div class="direction-grid">{% for d in directions %}<article><p class="kicker">{{ d.country }}</p><h2><a href="{% url 'travel:direction' d.pk %}">{{ d.name }} →</a></h2><p>{{ d.description|truncatechars:180 }}</p></article>{% endfor %}</div>{% endblock %}
