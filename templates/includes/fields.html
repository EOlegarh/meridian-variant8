{% for field in form %}<div class="field">{{ field.label_tag }}{{ field }}{% if field.help_text %}<div class="hint" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</div>{% endif %}{% for error in field.errors %}<p class="error" id="{{ field.auto_id }}_error_{{ forloop.counter }}">{{ error }}</p>{% endfor %}</div>{% endfor %}{{ form.non_field_errors }}
